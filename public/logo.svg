<svg viewBox="0 0 160 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="C-AI">
  <title>C-AI</title>

  <!-- Geometric C arc — the letterform "C" in C-AI -->
  <path
    d="M 56 18 A 26 26 0 1 0 56 58"
    stroke="currentColor"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Hyphen connecting C mark to AI -->
  <line
    x1="64" y1="38"
    x2="74" y2="38"
    stroke="currentColor"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- AI wordmark -->
  <text
    x="81"
    y="58"
    font-family="'Bebas Neue', sans-serif"
    font-size="48"
    fill="currentColor"
    letter-spacing="2"
  >AI</text>
</svg>
